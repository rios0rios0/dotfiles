name: 'Validate Dotfiles'

on:
  pull_request:
    branches: [ 'main' ]
  push:
    branches: [ 'main' ]

env:
  # Release installed by the test jobs below. Bump it here; the archive is verified
  # against the checksums file published with that release before it is installed.
  CHEZMOI_VERSION: '2.72.1'

# One pipeline, run as stages in order: code-check, security, tests, delivery. Every job of a
# stage `needs:` every job of the stage before it, so a stage starts only once the previous
# one has passed, and the jobs inside a stage run in parallel. It replaces 46 jobs that all
# started at once (19 of them running together at the peak) and the separate `checks` and
# `release` workflows, whose jobs now run here as the first and the last stage.
#
# `code-check > quality:basic-checks` runs on pull requests only, and GitHub skips every job
# downstream of a skipped one -- transitively -- unless its `if:` calls a status function. So
# each later stage is gated on `!cancelled() && !failure()`: it still runs when a job before it
# was skipped by design, never when one failed, and never on a cancelled run.
#
# Each stage's work is one `make` target: `make -k lint` in code-check, `make -k test` in tests.
# `-k` keeps going after a failure, so one failing linter or test does not hide the rest, and the
# job still fails. Both jobs run on ubuntu-24.04, the image Microsoft publishes a PowerShell package
# for, so the PowerShell linter and the pwsh tests run beside the rest instead of in jobs of their
# own.
#
# Every job declares its own `permissions:`: none needs more than `contents: read` but the
# release, so a broader grant one job needs never reaches the rest. CodeQL's
# missing-workflow-permissions check flags a new job that declares none.
jobs:
  # first stage
  checks:
    uses: 'rios0rios0/pipelines/.github/workflows/checks.yaml@main'
    permissions:
      contents: 'read'

  code_check-style_lint:
    name: 'code-check > style:lint'
    # 24.04, not ubuntu-latest: Microsoft publishes no PowerShell package for 26.04 yet, so the
    # install step fails with 'Unable to locate package powershell' there.
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - uses: 'actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e' # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: '.github/ci/cmd/tmplcheck/go.sum'
      - name: 'Install shellcheck, jq, ruff and yq'
        env:
          YQ_VERSION: '4.45.1'
        run: |
          sudo apt-get install -y shellcheck jq
          pip install --only-binary :all: --require-hashes -r .github/ci/requirements.txt
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 yq /usr/local/bin/yq
      - name: 'Install PowerShell'
        run: |
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q --max-redirect=0 "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: 'Install PSScriptAnalyzer'
        run: 'pwsh -Command "Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser"'
      - name: 'Download the template checker''s dependencies'
        working-directory: '.github/ci/cmd/tmplcheck'
        run: 'go mod download'
      - name: 'Run every linter'
        run: 'make -k lint'

  # second stage
  security-sast_gitleaks:
    name: 'security > sast:gitleaks'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    needs: [ 'checks', 'code_check-style_lint' ]
    if: '!cancelled() && !failure()'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Install gitleaks'
        env:
          GITLEAKS_VERSION: '8.24.0'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz
      - name: 'Run gitleaks'
        run: 'gitleaks detect --source . --verbose'

  # third stage
  tests-test_all:
    name: 'tests > test:all'
    # 24.04 for the PowerShell package, as `style:lint`: the `.ps1` tests and the Windows writer of
    # the home AGENTS.md run under pwsh, and skip without it, so the install proves itself below.
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    needs: [ 'security-sast_gitleaks' ]
    if: '!cancelled() && !failure()'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Install chezmoi'
        run: |
          cd "$(mktemp -d)"
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o "$archive" "$base/$archive"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o checksums.txt "$base/chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" chezmoi
          sudo install -m 0755 chezmoi /usr/local/bin/chezmoi
      - name: 'Install age, jq, sqlite3 and zsh'
        run: 'sudo apt-get install -y age jq sqlite3 zsh'
      - name: 'Install PowerShell'
        run: |
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q --max-redirect=0 "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
          pwsh --version
      # test-omniroute-restore runs its key check under the runner image's own node; nothing
      # here installs one.
      - name: 'Run every test'
        run: 'make -k test'

  # fourth stage
  release:
    uses: 'rios0rios0/pipelines/.github/workflows/release.yaml@main'
    needs: [ 'tests-test_all' ]
    if: "!cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'"
    # The release creates the tag and the GitHub Release; the called workflow can only narrow
    # what this job grants.
    permissions:
      contents: 'write'
