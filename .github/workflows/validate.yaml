name: Validate Dotfiles

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Release installed by the test jobs below. Bump it here; the archive is verified
  # against the checksums file published with that release before it is installed.
  CHEZMOI_VERSION: '2.72.1'

# Every job declares `permissions: contents: 'read'`: none needs more than to check out the
# repository and run its tools, whatever the repository's default token. Per job, as in
# checks.yaml, so a broader grant one job may need later never reaches the rest; a new job
# declares its own, and CodeQL's missing-workflow-permissions check flags one that does not.
jobs:
  lint-shellcheck:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: make lint-shellcheck

  lint-templates:
    name: Lint (Go templates)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: .github/ci/cmd/tmplcheck/go.sum
      - name: Download dependencies
        working-directory: .github/ci/cmd/tmplcheck
        run: go mod download
      - name: Validate template syntax
        run: make lint-templates

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ruff
        run: |
          pip install --only-binary :all: --require-hashes -r .github/ci/requirements.txt
      - name: Lint embedded Python
        run: make lint-python

  lint-powershell:
    name: Lint (PowerShell)
    # 24.04, not ubuntu-latest: Microsoft publishes no PowerShell package for 26.04 yet, so the
    # install step fails with 'Unable to locate package powershell' there.
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PowerShell
        run: |
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q --max-redirect=0 "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: Install PSScriptAnalyzer
        run: pwsh -Command "Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser"
      - name: Lint PowerShell scripts
        run: make lint-powershell

  lint-syntax:
    name: Lint (YAML/JSON)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        env:
          YQ_VERSION: '4.45.1'
        run: |
          sudo apt-get install -y jq
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 yq /usr/local/bin/yq
      - name: Validate YAML/JSON syntax
        run: make lint-syntax

  test-template-render:
    name: Test (template rendering)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          cd "$(mktemp -d)"
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o "$archive" "$base/$archive"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o checksums.txt "$base/chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" chezmoi
          sudo install -m 0755 chezmoi /usr/local/bin/chezmoi
      - name: Install jq and zsh
        run: sudo apt-get install -y jq zsh
      - name: Test template rendering with mock op
        run: make test-template-render

  test-chezmoiignore:
    name: Test (chezmoiignore logic)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          cd "$(mktemp -d)"
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o "$archive" "$base/$archive"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o checksums.txt "$base/chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" chezmoi
          sudo install -m 0755 chezmoi /usr/local/bin/chezmoi
      - name: Test platform file inclusion
        run: make test-chezmoiignore

  test-script-order:
    name: Test (script ordering)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify script dependency order
        run: make test-script-order

  test-modify-scripts:
    name: Test (modify scripts)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The JSON modify_ files are modify-templates, which only run inside chezmoi.
      - name: 'Install chezmoi'
        run: |
          cd "$(mktemp -d)"
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o "$archive" "$base/$archive"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 1 -o checksums.txt "$base/chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" chezmoi
          sudo install -m 0755 chezmoi /usr/local/bin/chezmoi
      - name: Install tools
        run: 'sudo apt-get install -y jq'
      - name: Test modify scripts
        run: make test-modify-scripts

  test-remove-dependencies:
    name: Test (dependency removal)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
