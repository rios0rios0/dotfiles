kind: 'Added'
body: 'added `termux-wake-lock` to the `claude` wrapper on Android, taken before the `exec` when `termux-tools` provides it, so Android does not pause the CPU of a backgrounded Termux mid-task. The lock is a Termux-level toggle rather than a per-session one: the wrapper `exec`s, so nothing releases it when Claude exits, and it persists until `termux-wake-unlock` is run by hand. It is idempotent'
