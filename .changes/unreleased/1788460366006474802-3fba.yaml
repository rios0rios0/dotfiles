kind: 'Added'
body: 'added `termux-wake-lock` to the `claude` wrapper on Android, taken before the `exec` when `termux-tools` provides it, so Android does not pause the CPU of a backgrounded Termux mid-task; the lock is idempotent and released with `termux-wake-unlock`'
