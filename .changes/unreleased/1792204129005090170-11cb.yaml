kind: 'Added'
body: 'added the Neon CLI (`neon`, the npm package from `neondatabase/neon-pkgs`, for Neon Serverless Postgres) to the Linux/WSL and Android dependency installers through a shared `install_neon_cli` in `.chezmoitemplates/lib-install-deps.sh` (`npm install -g --ignore-scripts neon`, behind a Node.js 20.19.0+ guard, called after `install_sentry_cli`), and there is deliberately no Termux wrapper, with Windows left out as for the Sentry CLI. Fresh installs take the `neon` package, never `neonctl`: since the two-package split `neon` holds the CLI and its executable, while `neonctl` is a compatibility shim whose only executable imports `neon/cli` in-process. The npm package is the whole CLI as a plain JavaScript ESM bundle (`bin` links `neon` to `dist/cli.js` with a `#!/usr/bin/env node` shebang), so one function body serves Termux native Node and NVM on Linux/WSL, and the shebang resolution under Termux is the Sentry CLI story. npm treats a mismatched engine as a warning, so the installer skips with a warning below 20.19.0 instead of installing a launcher the CLI docs say cannot run or upgrade. The standalone `neon-linux-arm64` binary is glibc-linked (interpreter `/lib/ld-linux-aarch64.so.1`) and cannot start on bionic, which is why the npm route is the one used on both platforms. The two native optional dependencies degrade on their own: `@napi-rs/keyring` (the opt-in `--keyring` OS-keyring storage) publishes no android-arm64 target and the CLI falls back to file-based credentials there, while `esbuild` (only for the bundling commands, `NEON_ESBUILD_PATH` overrides) ships `@esbuild/android-arm64` as a plain optional dependency, so `--ignore-scripts` skips only its fallback postinstall, verified with the JS API still bundling. Login is a browser flow (`neon login`) or an API key (`NEON_API_KEY`, `--api-key`, or `neon profile create <name> --api-key -` reading the key from stdin, so it never reaches an argument list), the API key being the route to rely on on the phone, where a `cred:NEON_API_KEY` field on the device note already reaches every shell through the credential loader. The README (development tools list and a known issue), `CLAUDE.md` (a `Neon CLI` section and the shared-library list), the Copilot instructions and the fresh-machine runbook (both install tables, the login steps and the verify blocks) document the tool. Both dependency installers change, so chezmoi re-runs the two `run_once_` scripts on the next apply; the guards make that pass mostly a no-op. The `--ignore-scripts` install, `neon --version` and the esbuild half are verified on Linux; the Termux half rests on the same properties as the Sentry CLI and is not yet verified on a device.'
