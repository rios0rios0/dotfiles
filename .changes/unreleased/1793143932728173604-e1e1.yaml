kind: 'Added'
body: 'made every OmniRoute archive restore the gateway by itself and copied it off the machine: `omniroute-backup` now packs `compose.env` (the secrets `.env` gives the gateway, cut to an allowlist; its `STORAGE_ENCRYPTION_KEY` is the only key that decrypts the stored provider credentials), a `manifest` (device, image, schema, provider and API key counts) and the CA bundle `OMNIROUTE_CA_BUNDLE` names beside the database and `server.env`, and copies each archive to a per-device folder in the personal OneDrive (`%OneDriveConsumer%`, never `%OneDrive%`, which on a machine also signed in to a work account names that one), where the newest 14 stay plus the newest of each of the last 12 months; an empty gateway rotates nothing out and is never mirrored, and a mirror that cannot be written fails the unit after the archive is kept'
time: '2026-10-27T23:32:12.728103787Z'
