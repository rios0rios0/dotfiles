kind: 'Fixed'
body: 'fixed the `terra update` calls in the Linux and Android dependency installers to set `TERRA_ASSUME_YES=true`, so `terraform` and `terragrunt` actually update during an unattended `chezmoi apply` instead of terra reporting "Non-interactive session - skipping update" (since terra 1.16.10 a non-terminal stdin, a `yes y` pipe included, makes it skip the prompt, and the variable the warning names is the only auto-answer); the `yes y` pipe stays as a fallback for a terra older than 1.16.10, whose prompt does read stdin'
time: '2026-10-17T22:37:58.891986427Z'
