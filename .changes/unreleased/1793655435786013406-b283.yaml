kind: 'Added'
body: 'added a question to the Windows configure step (`run_once_before_windows-002-configure-dependencies.ps1`): when `kali-linux` or Docker Desktop''s disks are on the system drive and another internal NTFS or ReFS drive has room (never a USB one, which reports itself as fixed too), it offers to move them to `<drive>:\wsl` and does so on a yes. Kali moves with `wsl --manage kali-linux --move` and is made the default again; Docker Desktop''s data disk (`docker_data.vhdx`, every image, container and volume, which no `wsl` command can move, since it is no distribution) is copied, `CustomWslDistroDir` is pointed at the copy, and only then is the original deleted, with its 100 MB `docker-desktop` distribution moved into `main\` beside it; Docker Desktop is stopped and WSL shut down meanwhile, and a Docker Desktop that never started only gets the location, so that its first start creates its disks there. A target folder that already holds a disk is never written over, nothing is asked without a terminal, and no step fails the apply'
