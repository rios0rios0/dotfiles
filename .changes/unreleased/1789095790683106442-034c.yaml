kind: 'Fixed'
body: 'fixed `az` and `oci` colliding in one Python environment on Linux/WSL: `install_azure_cli` and `install_oci_cli` both ran `pip install` into pyenv''s interpreter, and because pip resolves each command against only that command''s dependency graph, `pip install oci-cli` raised `cryptography` to `50.0.1` past the `<49` that azure-cli''s `msal` declares and reported the breakage only after writing it — both CLIs now install through the new `install_pipx_app`, which gives each its own pipx venv, verifies the entry point resolves into that venv (`~/.local/bin/oci` was squatted by a launcher from Oracle''s `install.sh`, which pipx reports as a note rather than a failure), treats an unreadable pipx layout and a failed uninstall as failures rather than skipping the check, removes only the distribution that owns the console scripts so importable libraries such as the `oci` SDK stay put, and runs `pyenv rehash` after removing the shared-environment copy so the stale shim stops shadowing it'
time: '2026-09-11T03:03:10.682994924Z'
