kind: 'Added'
body: 'installed chlog on Linux/WSL and Android with the owner''s other CLIs, so `chlog new` and `chlog check` work on every machine: `install_chlog` in `lib-install-deps.sh` runs `go install` on upstream''s `github.com/luizjhonata/chlog` at the pinned `v0.4.1` into `~/.local/bin`, verified by the Go checksum database and stamped with the version upstream''s release builds carry, so a later run skips the pinned build and replaces an older one; the `rios0rios0/chlog` fork only adds a `.gitignore` change and cannot be installed under its own name; both installers verify the call, and `make test-chlog` covers it against a stubbed `go`'
