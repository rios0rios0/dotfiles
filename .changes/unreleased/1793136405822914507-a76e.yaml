kind: 'Fixed'
body: 'fixed every reasoning model appearing several times in OpenCode''s picker: OmniRoute''s `/v1/models` added a `<model>-<tier>` row for each effort tier, and the Compose file now sets `OMNIROUTE_DISABLE_THINKING_LEVEL_VARIANTS`, so a model is listed once and its effort stays selectable as the variants ocode''s OmniRoute provider builds from `capabilities.effort_tiers` (`ctrl+t`, or `ocode run -m omniroute/<model>#high`); the stack is pinned to the newest successful build of the fork''s `reworked` branch, `f019053548`'
