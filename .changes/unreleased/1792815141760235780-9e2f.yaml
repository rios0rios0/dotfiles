kind: 'Fixed'
body: 'fixed the `ocode` fork build failing on a fresh clone and under a bun newer than the one the checkout pins: `run_after_linux-006-build-ocode.sh` now runs `bun install --frozen-lockfile` in the checkout before every build, since the build''s `--skip-install` only skips its own cross-platform install of two native packages and a fresh clone died on dozens of `Could not resolve: "effect"`, and it installs and builds with the bun pinned in the checkout''s `package.json` `packageManager`, as upstream OpenCode''s CI does, since bun 1.4.4 refused a patch file that the 1.4.2 pin applies; that bun is the resolved one when it is that version and otherwise a copy under `~/.cache/ocode-bun/<version>/`, downloaded from bun''s GitHub release (the `-baseline` x64 build on a CPU without AVX2) and verified against the release''s `SHASUMS256.txt`, while a missing or unreadable pin and a failed download warn and fall back to the resolved bun'
time: '2026-10-24T04:12:21.759468922Z'
