kind: 'Fixed'
body: 'fixed `#!/usr/bin/env` scripts exec''d directly from Claude Code tool calls on Termux, which is how the npm-installed Sentry CLI failed with `bad interpreter: /usr/bin/env: no such file or directory` while `zsh -c ''sentry --version''` worked (`copilot`, another npm bin, failed the same way). The `claude` wrapper parks `LD_PRELOAD` in `TERMUX_ETC_LD_PRELOAD` and `~/.zshenv` re-exports it, but an export from inside a running zsh reaches only that shell''s children (`make`, `bash -c`): the tool-call shell itself was started without `termux-exec`, so the kernel could not resolve the `/usr/bin/env` shebang of anything the shell exec''d directly. `run_once_before_android-001e-create-claude-wrapper.sh` now also writes `~/.local/bin/claude-zsh`, and the wrapper exports it as `CLAUDE_CODE_SHELL`, which Claude Code honours when the path contains `zsh`/`bash` and is executable (the shell type and rc file are derived from that string): the launcher restores the parked value, drops the `NODE_EXTRA_CA_CERTS` the wrapper sets for Claude''s own musl Node (bionic Node never needs it and the Sentry CLI warned about it on every run) and execs the real zsh, so the library is mapped before the shell''s first exec. A `CLAUDE_CODE_SHELL` already in the environment wins. The `.zshenv` restore stays as the fallback for Codex''s `zsh -lc` shells, a `termux-etc-mount` run by hand and older wrappers, and the `claude-exec-shim` repoint is unchanged: with the library in the shell, `grep`/`find` still reach the musl binary through the shim, and `termux-exec` passes `argv[0]` through untouched (verified: `ugrep 7.8.4` and `bfs 4.1.1` from a shell started by the launcher). The Sentry CLI keeps its npm layout: no per-tool wrapper, no `termux-fix-shebang` (which `sentry cli upgrade` would undo). `001e` changes, so chezmoi re-runs it on the next apply; start a fresh `claude` session afterwards'
