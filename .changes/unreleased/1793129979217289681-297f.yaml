body: 'added `run_after_windows-006-setup-powershell-profile.ps1`, which makes PowerShell 7 start with Oh My Posh and the `~/.oh-my-posh.json` theme that chezmoi deployed but nothing ever loaded: it keeps a marked block running `oh-my-posh init pwsh` in the all-hosts profile under the Documents folder Windows reports (OneDrive''s, when it moved it), leaves the rest of the profile alone, and says whether the block was already set up, updated or added; Windows PowerShell 5.1 is left out, since its default execution policy runs no profile; `make test-powershell-profile-windows` covers it'
