kind: 'Fixed'
body: 'fixed `grep` and `find` failing with exit 127 and eleven `Error relocating ... symbol not found` lines inside every Claude Code tool call on Termux. Claude Code appends its own `grep`/`find` functions to the shell snapshot it sources into each tool call, and both run the Claude Code binary itself under another `argv[0]` (`ARGV0=ugrep "$CLAUDE_CODE_EXECPATH" ...`, `ARGV0=bfs ...`) because that binary is multi-call and dispatches on `argv[0]` alone. They reach it through `$CLAUDE_CODE_EXECPATH`, which points straight at the musl build, from a shell where `dot_zshenv.tmpl` has just restored `LD_PRELOAD` for `termux-exec` -- so the musl loader is handed a bionic library it cannot relocate and exits before `main()`. The `claude` wrapper already parks `LD_PRELOAD` for the CLI itself, but it cannot be reused here: it is a `#!` script, and the kernel replaces `argv[0]` with the interpreter path when it runs one, so `ugrep` would be lost and the binary would start as the Claude CLI. The snapshot also defines its functions after `.zshenv` is sourced, so redefining `grep`/`find` there cannot win either. The Android block of `dot_zshenv.tmpl` therefore repoints `$CLAUDE_CODE_EXECPATH` at `~/.local/bin/claude-exec-shim` (parking the real path in `TERMUX_CLAUDE_EXEC_TARGET`), a small C program that new `run_after_android-006-build-claude-exec-shim.sh` compiles with `clang`: it parks `LD_PRELOAD` under the same `TERMUX_ETC_LD_PRELOAD` contract and `execv`s the target with `argv` untouched. Ordinary processes keep `LD_PRELOAD`, so `#!/bin/bash` and `#!/usr/bin/env` shebang rewriting is unaffected; a nested shell will not park the shim as its own target, and a missing shim leaves `$CLAUDE_CODE_EXECPATH` alone. Android only -- the rendered `.zshenv` is byte-identical on Linux and Windows'
