kind: 'Added'
body: 'added the Fly.io CLI (`install_fly_cli`) and the Oracle Cloud CLI (`install_oci_cli`) to the Linux and Android dependency installers, after the AWS and Azure CLIs. `flyctl` comes from the upstream installer run with `--non-interactive` and without `--setup-path`, so it never edits the rc files chezmoi owns; `dot_zshenv.tmpl` puts `~/.fly/bin` on PATH instead. `oci-cli` is a pip install inside the pyenv Python on Linux; on Android the `oci` SDK''s pinned `crc32c==2.8.0` wheel is pre-built with the `crc`, `crypto`, `aes` and `sha2` target features forced through `-Xclang -target-feature`, because the source relies on a GCC pragma Termux''s clang ignores and `-march` is overridden by its configuration. Windows stays without both, as it is without the AWS and Azure CLIs. README and the fresh-machine runbook list the two tools and their verification'
time: '2026-09-04T16:28:45.214134203Z'
