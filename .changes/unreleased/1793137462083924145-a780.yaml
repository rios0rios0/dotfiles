body: 'installed AutoBump with the other CLIs, which no machine got from the installers: on Linux/WSL `install_autobump` runs its upstream `install.sh` through `run_remote_installer`, which puts the latest release binary in `~/.local/bin`, and on Android it is built from source with Termux''s `golang`, like `aisync`, so that its go-git pushes and GitHub API calls resolve names through bionic'
