kind: 'Changed'
body: 'extracted the install functions whose body is identical on Linux/WSL and Android (`command_exists`, `install_oh_my_zsh`, `install_sdkman`, `install_nvm`) into `.chezmoitemplates/lib-install-deps.sh`, included by both dependency installers with a `template` directive; `run_once_before_linux-002-install-dependencies.sh` became a `.sh.tmpl` for the include. Android now runs the hardened Linux bodies (idempotent download guards, `sdk selfupdate force`, the Node.js LTS version check) while keeping its native `nodejs` early exit, Oh My Zsh is installed `--unattended` on both platforms with the login shell switched explicitly afterwards (`usermod` on Linux, Termux''s `chsh -s zsh` on Android, which the interactive installer used to do), and everything provisioned differently per platform (apt repositories versus binary downloads, upstream install scripts versus source builds, pyenv versus native Python) stays in the platform installers. Both rendered installers change, so chezmoi re-runs the two `run_once_` scripts on the next apply; the guards make that pass mostly a no-op. The shared bodies also pin the Oh My Zsh download to HTTPS (`--proto ''=https''`) and install corepack with `--ignore-scripts`, closing the two SonarCloud security findings raised on the new file, and the SDKMAN and NVM installers are downloaded to a temp file with `--proto ''=https'' -fsSL` and an explicit status check by a shared `run_remote_installer` helper instead of being piped from `curl` into `bash`'
