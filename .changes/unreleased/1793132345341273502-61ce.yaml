kind: 'Fixed'
body: 'fixed `make test-ocode` on Ubuntu 26.04, which `ubuntu-latest` now runs: its running-ocode cases started a copy of `/bin/sleep` as `~/.local/bin/ocode`, and uutils coreutils, Ubuntu''s default since 25.10, is one multi-call binary that picks the utility from its own file name, so the copy exited at once with `coreutils: unknown program ''ocode''` and every case that needs a running ocode failed on every pull request; a copy of bash waiting on a FIFO stands in for it now, which runs under any name and with any coreutils'
time: '2026-10-27T20:19:05.341273502Z'
