kind: 'Fixed'
body: 'fixed commit signing on WSL and Windows machines where 1Password is not the machine-wide install: `dot_gitconfig.tmpl` pointed git at `op-ssh-sign` under `C:\Program Files\1Password\app\8\`, which the Microsoft Store build and the per-user installer never create, so every commit failed with `cannot exec ... No such file or directory` while the SSH agent bridge answered with every key; WSL now signs with Linux''s `ssh-keygen`, which takes the signature from the agent through the bridge as Android does with its own, Windows finds `op-ssh-sign.exe` on `PATH` (the Store build''s alias) before falling back, and Linux verifies against `~/.config/git/allowed_signers`, rendered from the same fragment as Windows'' and Android''s `~/.ssh/allowed_signers`, instead of a Windows path built from the WSL user''s name'
time: '2026-10-27T21:54:22.292938077Z'
