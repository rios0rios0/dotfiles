kind: 'Fixed'
body: 'fixed commits in a work repository using the default (personal) Git identity and signing key: a workspace on the device note (`ws:<alias>`) named after the `ssh alias` of an SSH key now commits and signs as the identity of that key, through an `includeIf "gitdir:..."` in `~/.gitconfig` and a `~/.config/git/identities/<alias>` file that the new `run_after_linux-003` and `run_after_android-002` scripts write from 1Password, so no work name, email or path is written in this public repository; repositories outside every workspace keep the first SSH key as before, Windows gets no includes because its projects live in WSL, `make test ONLY=git-identities` covers it with real commits, and the README, `AGENTS.md` and the Copilot instructions describe it'
