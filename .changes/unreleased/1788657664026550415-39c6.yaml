kind: 'Added'
body: 'added the Codex CLI to every platform: `install_codex_cli` installs the `@openai/codex` npm package on Linux/WSL next to Claude Code, `OpenAI.Codex` joins the winget development list on Windows, and Android gets `run_once_before_android-001f-create-codex-wrapper.sh`, a `codex` wrapper for the GitHub release''s static `aarch64-unknown-linux-musl` binary. `npm install -g @openai/codex` cannot work on Termux -- the platform package `@openai/codex-linux-arm64` declares `os: linux` while Termux''s Node reports `android`, so npm skips it and the launcher throws `Missing optional dependency` -- and the Android installer removes such an install before bootstrapping the wrapper. The wrapper runs the binary through `termux-etc-mount` for DNS (musl reads `/etc/resolv.conf` through direct syscalls), sets `SSL_CERT_FILE` to Termux''s CA bundle because rustls probes the usual bundle paths with `stat()`, which Tier 3 does not redirect, defaults `sandbox_mode` to `danger-full-access` because the bubblewrap sandbox needs user namespaces that Android''s SELinux policy denies (every other mode panics before running a command), parks `LD_PRELOAD` under the `TERMUX_ETC_LD_PRELOAD` contract, takes `termux-wake-lock`, and handles updates itself since `codex update` refuses manual installs: the first launch downloads the latest release in the foreground, later launches check the `releases/latest` redirect once per 24h in the background, keep three builds under `~/.local/share/codex/versions/`, and silence Codex''s own startup update nag; `CODEX_WRAPPER_NO_AUTO_UPDATE`, `CODEX_WRAPPER_FORCE_VERSION` and `CODEX_WRAPPER_KEEP_SANDBOX` override each part. `make test-script-order` now pins every Android wrapper (`001c` to `001f`) before the installer. The three dependency installers change, so chezmoi re-runs the `run_once_` scripts on the next apply; the guards make that pass mostly a no-op'
