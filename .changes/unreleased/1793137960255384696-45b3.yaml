kind: 'Fixed'
body: 'fixed the Windows installation steps in the README and the fresh-machine runbook, which started at `winget install` on machines where winget did not answer yet: they now install the App Installer bundle from the `winget-cli` release first, add `C:\Users\<USER>\AppData\Local\Microsoft\WindowsApps`, where the `winget.exe` alias lives, to the user `Path`, and open a new terminal before the first `winget install`'
