kind: 'Added'
body: 'added `modify_dot_wslconfig`, which keeps the WSL settings `.chezmoidata/wsl.yaml` names in Windows'' `%UserProfile%\.wslconfig`: gradual memory reclaim, sparse VHDs for new distributions, and `instanceIdleTimeout=-1` ("Keep WSL running"), so a WSL machine''s Ollama goes on serving the tailnet share after its last WSL terminal closes; it is a modify-template that sets a managed key whose value differs, adds a missing one, keeps every other line and the file''s own line endings, compares keys and values case-insensitively as WSL does, and passes a file with nothing to change through byte for byte; `make test-modify-scripts` covers it'
