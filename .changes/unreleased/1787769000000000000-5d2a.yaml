kind: 'Security'
body: 'upgraded `golang.org/x/crypto` from `0.49.0` to `0.55.0` in the `tmplcheck` CI helper (`.github/ci/cmd/tmplcheck`), clearing 13 Dependabot alerts — 7 critical, 2 high, 4 medium — against `golang.org/x/crypto/ssh`, `ssh/agent`, and `ssh/knownhosts`. Dependabot cannot fix these itself: the module lives under `.github/`, which the Dependabot app is not authorised to write to, so every `create_pull_request` call is rejected with a 400 and 11 consecutive update runs failed. `github.com/Masterminds/semver/v3` moved `3.4.0` to `3.5.0` in the same tidy.'
time: '2026-08-26T18:30:00.000000000Z'
