kind: 'Fixed'
body: 'fixed `compinit:533: no such file or directory: /usr/share/zsh/vendor-completions/_docker` on the first shell of a new WSL machine while Docker Desktop was not up yet: Docker Desktop links that file into a mount that exists only while it runs, and `compinit` opens every completion file when it builds its dump. `.zshrc` now installs `docker/cli`''s `_docker` with `zinit ice as"completion"` before Oh My Zsh runs `compinit`, whether or not `docker` answers, so `compinit` takes that copy and never opens the link. The snippet is no longer sourced at every shell start either, which ran `_docker` outside the completion system and replaced the completion Oh My Zsh''s `docker` plugin generates for the installed Docker CLI'
time: '2026-11-02T23:16:44.330372307Z'
