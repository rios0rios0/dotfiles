kind: 'Removed'
body: 'removed the folder watcher (`dot_scripts/executable_linux-toolbox-watch-compress-folders.sh`), its first-apply restore (`run_once_after_linux-001-extract-compressed-folders.sh`), the `dot_zshrc.tmpl` launcher that started it in every interactive shell and `make test-extract-folders`, and stopped syncing the directories it archived -- `~/.john`, `~/.sqlmap` and `~/.kube` (`dot_john/`, `dot_sqlmap/` and `private_dot_kube/`, the primary kubeconfig included): the mechanism was unmaintained and failed silently. chezmoi leaves unmanaged files in place, so the decrypted copies stay on each machine and only stop syncing between devices; the stale `~/.kube/config-files.tar` the old tarball deployed is tombstoned in `.chezmoiremove`, and `linux-engineering-detect-kube-config-files.sh` still merges any local `~/.kube/config-files/` at shell start'
