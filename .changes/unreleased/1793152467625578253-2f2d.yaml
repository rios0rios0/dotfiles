kind: 'Added'
body: 'added the Atuin login and the one-time zsh-histdb import to every apply on Linux and Termux: a device with no Atuin session logs in with the account in the 1Password item `Atuin` (fields `password` and `key`, named in `.chezmoidata/atuin.yaml`), the password handed to `atuin login` in its environment and the key on its stdin, read through `op` at run time on Linux and rendered from chezmoi''s own 1Password session on Termux, only when the render finds no session; the apply after it imports the commands recorded under the device''s own hosts from a private copy of `~/.histdb/zsh-history.db` (the desktop''s two names, and Termux''s `localhost` under the device''s name), once, through a marker in `~/.atuin/data/`, then syncs them with an `ATUIN_SESSION` of its own; every failure is a warning the next apply retries, registration stays by hand on the server''s device, and the client''s config now names the key where Atuin `18.24.2` keeps it, `~/.atuin/data/key`'
time: '2026-10-28T01:54:27.625578253Z'
