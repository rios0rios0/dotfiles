kind: 'Added'
body: 'added an `xclip` shim and a `clipshot` stager on Android so Claude Code''s Ctrl+V can attach screenshots. Claude Code reads clipboard images by shelling out to `xclip`/`wl-paste`, which can never work under Termux (no X11 or Wayland display, and Android''s clipboard cannot pass a bitmap across the app sandbox), so paste always reported "No image found in clipboard". The shim answers the two invocations Claude Code makes and synthesises the clipboard from the newest screenshot in `~/storage`, bounded by a freshness window so a stale image is never attached, and marked consumed after one read so Ctrl+V still falls through to text. Both scripts read the watched folders from a single `dot_local/lib/claude-clipboard.sh`, so the shim and `clipshot -s` cannot disagree about what Ctrl+V would attach, and `make test-clipboard-shim` covers the behaviour against the literal `xclip` command lines'
