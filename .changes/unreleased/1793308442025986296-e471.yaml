kind: 'Fixed'
body: 'fixed every `chezmoi apply` on Windows and WSL failing at its first 1Password template with `cannot connect to 1Password app, make sure it is running`: the 1Password app removes the pipe its CLI connects through for about 0.9 s after an `op account list`, and chezmoi runs `op signin` straight after it, so the WSL `op` wrapper now retries exactly that failure a second later, and on Windows chezmoi runs `op.exe` itself with `OP_ACCOUNT` set and the templates naming no account, so it never runs `op account list` there and one approval covers the whole apply; a Windows machine picks this up with `chezmoi init`, which the config guard now asks for'
time: '2026-10-29T21:14:02.025926741Z'
