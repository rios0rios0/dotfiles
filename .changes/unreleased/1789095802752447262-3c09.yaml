kind: 'Changed'
body: 'changed `install_codex_cli` on Linux/WSL and Android to verify the install instead of assuming it: the Linux function now fails when `npm` is unavailable, when the install errors, or when `codex` is still absent from PATH afterwards, and the Android function fails when no build landed under `~/.local/share/codex/versions` after the wrapper bootstrap. All of these previously left the installer reporting success with no Codex CLI on the machine'
