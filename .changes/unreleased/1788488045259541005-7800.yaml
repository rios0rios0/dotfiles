kind: 'Added'
body: 'added `.docs/fresh-machine-setup.md`, a linear runbook for provisioning an empty Windows 11, Kali on WSL or Termux machine with this repository: the 1Password items every platform reads at render time, six ordered phases with every item marked `[automated]` (with the script behind it), `[partial]` or `[manual]`, verification commands per phase, the automation gaps worth turning into issues, and the checklist from issue #30 mapped item by item. Linked it from the README''s Installation section, added the missing `winget install twpayne.chezmoi` to the Windows bootstrap, and corrected the "What''s Managed" lists: Heroku CLI, ImageMagick and the CycloneDX CLI are not installed by any script, and `pdftk` only exists on Windows and baremetal Linux. Also corrected the `chezmoi state delete-bucket` bucket name in `.github/copilot-instructions.md` from `scriptStates` to `scriptState`, the name `chezmoi state dump` reports'
