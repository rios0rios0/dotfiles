body: 'added Tailscale on every Linux machine: installed from its signed apt repository with the key checked by fingerprint, logged in once by `chezmoi apply` (it prints the login URL and waits for it), and kept on the tailnet by every interactive zsh through `tailscale-up --no-login`, which never waits or asks for a password'
