kind: 'Fixed'
body: 'fixed Windows Terminal''s PowerShell profile failing to open with error `0x80070002` ("The system cannot find the file specified") when PowerShell 7''s folder is on neither `PATH`: the profile starts `pwsh.exe` by name, so `run_after_windows-004-add-powershell-to-path.ps1` now adds the folder PowerShell''s installer recorded, or `%ProgramFiles%\PowerShell\7`, to the end of the user''s `PATH` on every apply where no folder on the machine''s or the user''s `PATH` holds `pwsh.exe`, without elevation, keeping the other entries, their unexpanded variables and the value''s kind, and tells Explorer about the change; `make test ONLY=powershell-path-windows` covers it'
time: '2026-11-25T19:51:28.578894093Z'
