body: 'added a pre-apply check that stops `chezmoi apply` before any installer runs when the machine''s chezmoi config predates a data key the templates read, such as `deviceName`, and says to run `chezmoi init`; a config generated from an older `.chezmoi.yaml.tmpl` used to surface only after the installers, as `map has no entry for key "deviceName"` in `dot_gitconfig.tmpl`'
