kind: 'Fixed'
body: 'fixed Claude Code reporting `pyright-langserver` (and, for TypeScript files, `typescript-language-server`) not found after NVM''s default Node changes: `run_onchange_after_linux-012-setup-claude-lsp.sh` now installs `pyright` and `typescript-language-server`, with `typescript` `6.0.3`, into `~/.local/share/claude-lsp` and links the two servers from `~/.local/bin`, where `gopls` already lives, instead of into NVM''s per-version tree, where the switch from Node `v24` to `v26` left them behind; the Linux removal script drops the copies an earlier apply left in the current Node''s tree, which `.zshenv` would put ahead of the links, and `make test ONLY=claude-lsp` covers the prefix, the links, a repointed link and a new NVM default'
