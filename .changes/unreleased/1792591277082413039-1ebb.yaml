kind: 'Fixed'
body: 'fixed ggshield''s pre-commit hook still appending `# Added by ggshield` and `.cache_ggshield` to the `.gitignore` of a repository holding its cache, which the `~/.gitignore` entry from #214 never prevented: ggshield runs git with `GIT_CONFIG_GLOBAL` and `GIT_CONFIG_SYSTEM` blanked, so its `git check-ignore` never reads `core.excludesFile` and falls back to `~/.config/git/ignore`, which chezmoi now manages on Linux with that entry'
time: '2026-10-21T14:01:17.08228003Z'
