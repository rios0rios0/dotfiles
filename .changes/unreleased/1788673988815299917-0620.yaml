kind: 'Fixed'
body: 'fixed `#!/usr/bin/env` scripts exec''d directly from Codex CLI tool calls on Termux -- the other half of the Claude Code fix in this release. `sentry --version` run from a `codex exec` tool call died with `bad interpreter: /usr/bin/env: No such file or directory` (exit 126), and so did any other npm-installed CLI or `#!/usr/bin/env bash` script. `termux-etc-mount` drops `LD_PRELOAD` before the static musl `codex` binary starts and the wrapper parks it in `TERMUX_ETC_LD_PRELOAD`, but nothing handed it back to the shells Codex spawns for tool calls, not even for their children: Codex never consults `$SHELL`. It resolves the shell from the password database (`getpwuid_r`), and Termux''s entry is `$PREFIX/bin/login`, which names no shell it knows, so the Linux fallback order applies, `which bash` wins, and a tool call runs `$PREFIX/bin/bash -lc "<cmd>"` -- a shell that never sources `~/.zshenv` (verified on a device: `LD_PRELOAD` unset and no `termux-exec` mapping in the tool shell). A `CLAUDE_CODE_SHELL`-style launcher is no help either, because Codex picks the shell binary itself. `run_once_before_android-001f-create-codex-wrapper.sh` therefore appends `-c ''shell_environment_policy.set.LD_PRELOAD=<parked value>''` to every launch: Codex applies that policy to the environment it spawns tool commands with, so `termux-exec` is mapped before the tool shell''s first `execve`, whichever shell Codex picks. The fallback matches `~/.zshenv` (`termux-exec` alone when nothing was parked) and `CODEX_WRAPPER_KEEP_LD_PRELOAD=1` opts out. Verified end to end with `codex exec` on a device: before, `sentry --version` and a `#!/usr/bin/env bash` probe both failed with `bad interpreter` and `grep -c termux-exec /proc/$$/maps` printed `0`; after, `0.44.1`, the probe''s marker, and `3`. `001f` changes, so chezmoi re-runs it on the next apply'
