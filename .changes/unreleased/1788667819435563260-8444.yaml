kind: 'Added'
body: 'added the Sentry CLI (`sentry`, the npm package from `getsentry/cli`, not the classic Rust `sentry-cli`) to the Linux/WSL and Android dependency installers through a shared `install_sentry_cli` in `.chezmoitemplates/lib-install-deps.sh`. The official `cli.sentry.dev/install` script is deliberately not used: it downloads a Bun-compiled `sentry-linux-<arch>` executable linked against glibc (the musl variants stopped shipping after `0.34.0`), which bionic cannot start, so on Termux it dies with `No such file or directory` before `sentry cli setup` runs. The npm package is the same CLI as a plain JavaScript bundle with no platform package and no lifecycle script (`engines.node >= 20`), so it runs under Termux''s native Node without any `termux-etc-redirect` wrapper and under NVM on Linux/WSL with one function body, installed with `--ignore-scripts`; `sentry cli upgrade` detects the npm layout and upgrades through npm, and a device with the install verified `sentry --version`, `sentry cli upgrade --check` (network, TLS and `node:sqlite`) and an unauthenticated API call failing at the auth layer rather than at DNS. Both installers change, so chezmoi re-runs the two `run_once_` scripts on the next apply; the guards make that pass mostly a no-op. README, CLAUDE.md, the Copilot instructions and the fresh-machine runbook document the tool, the login flow (`sentry auth login`, a device code that works on the phone). Shell completions and the Claude Code agent skill come from `sentry cli setup --no-modify-path`, run by the new `run_onchange_after_linux-007-setup-sentry-cli.sh` and `run_onchange_after_android-006-setup-sentry-cli.sh` after the managed files are applied, with `SHELL` pinned to zsh; `dot_zshrc.tmpl` puts `~/.local/share/zsh/site-functions` on `fpath` as the quoted absolute path the CLI checks for, because even with `--no-modify-path` the command appends its own `fpath` line to `~/.zshrc` when that path is missing, an edit the next apply would revert. Windows is left out: the Windows installer is winget-only'
