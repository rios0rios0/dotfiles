kind: 'Fixed'
body: 'fixed the first apply on Linux restoring nothing from the folder watcher''s archives: `run_once_after_linux-001-extract-compressed-folders.sh` looked for `-home-<user>-<folder>.tar.gz` in its working directory, a name the watcher stopped writing in 2025, so every first apply printed four `does not exist` warnings and `~/.kube/config-files` was never unpacked from the `~/.kube/config-files.tar` the apply decrypts; it now reads the `<folder>.tar` the watcher writes beside each folder, restores only a folder that does not exist, unpacks it beside its target and renames it into place so a failure leaves nothing half-restored, says nothing when there is nothing to restore, and stops a running watcher so the next shell watches the restored folder, covered by `make test-extract-folders`'
time: '2026-10-27T21:52:40.240008890Z'
