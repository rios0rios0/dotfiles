kind: 'Added'
body: 'added shell history sync with Atuin on Linux and Termux: every zsh records its commands with `atuin` `18.24.2` (the release tarball, pinned and SHA-256 checked, on Linux; Termux''s `atuin` package), which syncs them end-to-end encrypted through one self-hosted server, a Docker container on `alien-a51` defined in `local-services/atuin/compose.yaml` and pinned by digest, that `tailscale-up` shares on the tailnet; `.chezmoidata/atuin.yaml` names the server, which every other device reaches by its MagicDNS name, the client never contacts `api.atuin.sh`, Atuin starts after Oh My Zsh so that its Ctrl-R and up-arrow bindings win, Termux records its device name rather than `localhost`, and `.docs/atuin-sync.md` covers the server, the account and the one-time import of the old history, covered by `make test-atuin`; moving the server to an always-on machine is #272'
time: '2026-10-27T23:39:46.220891644Z'
