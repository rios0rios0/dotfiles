kind: 'Fixed'
body: 'fixed a new Node.js LTS silently starting without the global npm packages of the version before it, as Node `v26` did on alien-a51, which received none of `v24`''s: `install_nvm` now carries them over itself with `carry_npm_globals`, one `npm install -g --ignore-scripts` per package at the version it had, in place of nvm''s `--reinstall-packages-from`, which put them all into one install with their scripts so that a single failure carried none, and whose failure nothing reported; it names every package that does not come across with the command that installs it, and a switch that goes wrong (a package that does not come across, or an LTS that does not install) fails the run once, through `verify`, with a marker in `$NVM_DIR` so that the next run retries it, while a retry that goes wrong too only warns, so that a package which can never install does not re-run the 45-120 minute installer on every apply; it never carries `npm`, `corepack`, linked packages or a package whose command is already in `~/.local/bin`, which a copy in NVM''s bin would shadow, and once it is done it names the old version with the `nvm uninstall` that removes it'
time: '2026-11-21T22:23:23.326683261Z'
