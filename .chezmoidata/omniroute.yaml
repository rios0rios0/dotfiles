# Claude Code through OmniRoute: `claude-omni`, `claude-omni-task` and the status line read these
# settings through .chezmoitemplates/lib-omniroute.tmpl. See .docs/omniroute-local.md and
# CLAUDE.md, "Claude Code Through OmniRoute (claude-omni)".
#
# chezmoi reads this file on every apply, so an edit reaches the wrapper on the next apply without
# `chezmoi init`. OmniRoute's own state -- providers, keys, hidden models, window overrides -- lives
# in its database, not here; the lineup claude-omni offers is whatever /v1/models answers at launch.
omniroute:
  # The gateway. Its API key is the `cred:OMNIROUTE_API_KEY` field of this device's 1Password note,
  # which the shell exports as OMNIROUTE_API_KEY; it never appears in this repository.
  baseUrl: 'http://127.0.0.1:20128'
  # OmniRoute's Ollama providers, by the prefix of their model ids. A GPU model is the `model` of
  # local-llm.yaml on that provider, and its window is local-llm.yaml's `contextTokens`: what the
  # server allocates. OmniRoute cannot see that value and advertises its 128000 fallback instead,
  # which would let Claude Code run past the point where Ollama truncates the prompt.
  #   machine: 'local'    this machine; claude-omni starts its user unit on demand
  #   machine: 'tailnet'  another machine on the tailnet; claude-omni finds it the way
  #                       `claude-remote` did, loads the model, and checks the window it serves
  # Defaults are for alien-a51 (laptop). The desktop's WSL config uses deviceName mxhero-z790 and
  # swaps the local/remote GPU roles below. Set CHEZMOI_DEVICE before `chezmoi init` if its
  # normalized hostname differs from the device note.
  gpus:
    ollama-laptop:
      machine: 'local'
      label: 'laptop GPU'
    ollama-desktop:
      machine: 'tailnet'
      label: 'desktop GPU'
  # The models the launch picker and Claude Code's /model offer are the gateway's own: claude-omni
  # reads OmniRoute's /v1/models on every launch, keeps every chat model that can call tools, and
  # leads the list with `gpuModel` on each GPU. No list lives here, so curation moves to OmniRoute
  # itself: hide a model in its dashboard, or scope the API key's policy, and the picker follows on
  # the next launch. `claude-omni --list` prints the result, `--list --all` what OmniRoute holds.
  #
  # Claude Code's effort level (low, medium, high, xhigh) for a model is the one per-model setting
  # kept here, keyed by the full OmniRoute id; a model left out runs at Claude Code's default:
  #   efforts:
  #     nvidia/z-ai/glm-5.3: low
  efforts: {}
  # The window a session on an `auto/*` combo compacts at. OmniRoute advertises the largest window
  # in the combo's pool (2,000,000) and routes a request to a model that holds it, so this one only
  # decides how large the conversation may grow before Claude Code summarizes it.
  autoWindow: 200000
  # The GPUs a delegated run (`claude-omni-task` without -m) tries, in order: the first one free and
  # serving takes the run. A cloud model runs only when the caller names it with -m.
  taskGpus: ['ollama-laptop', 'ollama-desktop']
  # A session on a small window has to fit what Claude Code loads before the first prompt, so up to
  # `maxWindow` it gets a lean profile (measured in .docs/omniroute-local.md, "The profile"):
  #   rules  the global rules it keeps; the rest of ~/.claude/rules (~30K tokens) is excluded
  #   tools  the tools it gets; for a model it does not recognise, Claude Code sends every schema
  #          with every request (27K tokens) instead of deferring the rarely used ones (5.8K)
  # Above it, a session gets every rule and every tool.
  lean:
    maxWindow: 131072
    rules: ['code-style', 'git-flow', 'testing']
    tools: ['Bash', 'Read', 'Edit', 'Write', 'Glob', 'Grep']
  # Overrides for one device, keyed by its chezmoi `deviceName`; any key above may be set, e.g.
  #   devices:
  #     some-desktop:
  #       taskGpus: ['ollama']
  devices:
    mxhero-z790:
      gpus:
        ollama-desktop:
          machine: 'local'
          label: 'desktop GPU'
        ollama-laptop:
          machine: 'tailnet'
          label: 'laptop GPU'
      taskGpus: ['ollama-desktop', 'ollama-laptop']
