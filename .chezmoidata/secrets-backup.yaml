# The home-secrets backups (secrets-backup, WSL only; see "Home-Secrets Backups" in CLAUDE.md and
# .docs/secrets-backup.md). An age-encrypted archive of the folders below, kept on this machine and
# copied to the personal OneDrive, exactly as the OmniRoute backups are. Those folders stopped
# syncing through chezmoi in #276 -- they are security-tool state and cluster config, not good to
# commit to the repository, and the inotify watcher that archived them was flaky -- so this backs
# them up off the machine without putting them, or that watcher, back.
#
# chezmoi reads this on every apply, so an edit reaches the backup and restore on the next apply.
secretsBackup:
  # The things to back up, home-relative. Each is archived only when it exists, so a machine
  # without one skips it. `.kube/config` and `.kube/config-files` are named rather than `.kube`
  # whole, to leave out its regenerable discovery caches (`~/.kube/cache`, `~/.kube/http-cache`).
  sources:
    - '.john'
    - '.sqlmap'
    - '.kube/config'
    - '.kube/config-files'
  # The newest `keep` archives stay on this machine. Each run also copies its archive to
  # `<mirror>/<deviceName>/`, where the newest `mirrorKeep` stay, plus the newest archive of each of
  # the `mirrorMonthly` most recent months. `mirror` is 'onedrive-personal' -- the folder Windows
  # names in %OneDriveConsumer%, never %OneDrive%, which on a machine also signed in to a work
  # account names that one -- an absolute path, or '' for no copy off this machine.
  keep: 14
  mirror: 'onedrive-personal'
  mirrorKeep: 14
  mirrorMonthly: 12
