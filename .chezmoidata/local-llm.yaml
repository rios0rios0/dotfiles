# The local model server: Ollama on this machine's NVIDIA GPU, one of OmniRoute's providers, which
# Claude Code reaches through `claude-omni`. See .docs/local-coding-model.md and CLAUDE.md, "Local
# Model Server (Ollama)".
#
# chezmoi reads this file on every apply -- unlike `data:` in .chezmoi.yaml.tmpl, which only
# `chezmoi init` regenerates -- so an edit reaches the Ollama unit, its installer and claude-omni
# together on the next apply. All three read it through .chezmoitemplates/lib-local-llm.tmpl;
# claude-omni through .chezmoitemplates/lib-omniroute.tmpl, which includes it.
localLLM:
  # Installed and served on every Linux machine with an NVIDIA driver unless this is false,
  # here or for one device below.
  enabled: true
  model: 'qwen3.8:27b'
  # Rendered into both OLLAMA_CONTEXT_LENGTH, which is what the server allocates, and the window
  # claude-omni declares for this model on every GPU (CLAUDE_CODE_MAX_CONTEXT_TOKENS), which is what
  # Claude Code budgets against. Neither Claude Code nor OmniRoute can read it from Ollama --
  # OmniRoute advertises a 128000 fallback -- so the two must agree, and one value is what makes
  # them agree.
  #
  # Sized for a 24 GB GPU that also drives a display: qwen3.8:27b is ~18 GB with its vision
  # projector, and only 16 of its 64 layers keep a KV cache, so 64K of q8_0 cache costs ~2 GiB.
  contextTokens: 65536
  # q8_0 halves the cache against the f16 default; it needs flash attention, which Ollama turns
  # on by itself for any CUDA GPU from compute capability 6.0.
  kvCacheType: 'q8_0'
  # How long an idle model stays in VRAM. The GPU is shared with the Windows desktop and games,
  # so it is given back after a while rather than held for good.
  keepAlive: '15m'
  # Share this machine's server with the other machines on the tailnet, so that OmniRoute on them
  # can use this GPU and claude-omni can check its window: tailscale-up forwards the tailnet's port
  # 11434 to it (`tailscale serve`, never Funnel; on WSL, Windows' client forwards to Windows'
  # `localhost`, which WSL hands on to Ollama). Ollama binds to all interfaces so Tailscale Serve
  # can expose it; local Docker Desktop reaches it through host.docker.internal. The API has no
  # authentication, so restrict access with the machine's network firewall.
  shareOnTailnet: true
  # Overrides for one device, keyed by its chezmoi `deviceName`; any key above may be set, e.g.
  #   devices:
  #     some-desktop:
  #       contextTokens: 131072
  devices: {}
