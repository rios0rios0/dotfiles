# The home-secrets sync (secrets-sync, WSL only; see "Home-Secrets Sync" in CLAUDE.md and
# .docs/secrets-sync.md). Every device writes one snapshot per tool to the hub -- by default
# %OneDriveConsumer%\Backup\sync\<tool>\<deviceName>.tar.age -- and merges everyone's into its own
# folders, so the devices share one set of kubeconfigs, cracked hashes and sqlmap sessions, and a
# delete on one reaches the others. No device ever writes another's snapshot: OneDrive has no
# locking, and two devices rewriting one file would fork it. The daily backups (secrets-backup.yaml)
# stay underneath, because a sync copies mistakes too.
#
# chezmoi reads this on every apply, so an edit reaches the sync on the next apply.
secretsSync:
  # 'onedrive-personal' -- %OneDriveConsumer%\Backup\sync, never %OneDrive%, which on a machine also
  # signed in to a work account names that one -- an absolute path, or '' to switch the sync off.
  hub: 'onedrive-personal'
  # How long a delete is remembered. A device that has not synced for longer can bring back what
  # was deleted meanwhile.
  tombstoneDays: 365
  # A run that would delete more than this share of a tool's entries stops until it is run with
  # --allow-deletes, so one mistake does not empty every device. Deleting a single entry is always
  # allowed.
  maxDeletePercent: 50
  # The tools, each synced on a device whose folder for it exists (the parent of `path`: ~/.kube,
  # ~/.john, ~/.sqlmap). `merge` is how its copies combine:
  #   entries  each file or folder directly inside `path` is one entry; the newest wins, by its
  #            modification time, and a deleted entry is deleted everywhere
  #   lines    `path` is a file of lines; every device's lines join, and a deleted line is deleted
  #            everywhere
  # `localLines` (entries only) is an extended regular expression for the lines a file keeps to
  # itself: they are neither compared nor published, and stay when a newer copy arrives.
  tools:
    # One kubeconfig per cluster. Their current-context stays on each device: kubectl writes it
    # into the first file in KUBECONFIG that has one, which is one of these, so syncing it would
    # switch every device's cluster when one switches. ~/.kube/config stays out altogether: its
    # contexts (Docker Desktop, kind) point at the machine's own loopback.
    - name: 'kube'
      path: '.kube/config-files'
      merge: 'entries'
      localLines: '^current-context:'
    # John the Ripper's cracked hashes, one per line. john.log and the session files (*.rec) stay
    # on each device.
    - name: 'john'
      path: '.john/john.pot'
      merge: 'lines'
    # One folder per target, holding sqlmap's session database: the same target on two devices is
    # two sessions, and the newest wins.
    - name: 'sqlmap'
      path: '.sqlmap/output'
      merge: 'entries'
