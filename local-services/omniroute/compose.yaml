name: 'dotfiles'

services:
  redis:
    image: 'docker.io/library/redis:8.6.5-alpine'
    restart: 'always'
    # Let the Redis image repair /data ownership, then drop privileges before starting Redis.
    security_opt: ['no-new-privileges:true']
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - 'omniroute-redis-data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: '10s'
      timeout: '5s'
      retries: 3

  omniroute:
    # Known-good v3.8.51 linux/amd64 release image digest.
    image: 'ghcr.io/diegosouzapw/omniroute@sha256:77b38c546e1c74add83d73cd2c752342c364c0565fb0cc21eb4792e9c0a5cb79'
    platform: 'linux/amd64'
    restart: 'always'
    stop_grace_period: '40s'
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    env_file: ['.env']
    environment:
      DATA_DIR: '/app/data'
      REDIS_URL: 'redis://redis:6379'
      REQUIRE_API_KEY: 'true'
      ALLOW_API_KEY_REVEAL: 'false'
      OMNIROUTE_MEMORY_MB: '2048'
      NODE_EXTRA_CA_CERTS: '/run/omniroute-ca/ca-bundle.pem'
    ports:
      - '127.0.0.1:20128:20128'
      - '127.0.0.1:20129:20129'
      - '127.0.0.1:20132:20132'
    volumes:
      - type: bind
        source: "${OMNIROUTE_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        target: '/run/omniroute-ca/ca-bundle.pem'
        read_only: true
        bind:
          create_host_path: false
      - 'omniroute-data:/app/data'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.mjs']
      interval: '30s'
      timeout: '5s'
      retries: 3
      start_period: '20s'

volumes:
  omniroute-data:
  omniroute-redis-data:
