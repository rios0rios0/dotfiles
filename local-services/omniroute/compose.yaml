name: 'dotfiles'

services:
  redis:
    image: 'docker.io/library/redis:8.6.5-alpine'
    restart: 'always'
    # Let the Redis image repair /data ownership, then drop privileges before starting Redis.
    security_opt: ['no-new-privileges:true']
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - 'omniroute-redis-data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: '10s'
      timeout: '5s'
      retries: 3

  omniroute:
    # The rios0rios0/OmniRoute fork (branch reworked), built by
    # .github/workflows/publish-ghcr.yml in the fork and pinned by digest. Move the pin with
    # `./update-image.sh`; see .docs/omniroute-local.md, "The custom fork image".
    image: 'ghcr.io/rios0rios0/omniroute@sha256:df266a214c2dfec50c3813efdad07ea6711a205f529ab48bf027e37dfbe1c4a8'
    platform: 'linux/amd64'
    restart: 'always'
    stop_grace_period: '40s'
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    env_file: ['.env']
    environment:
      DATA_DIR: '/app/data'
      REDIS_URL: 'redis://redis:6379'
      REQUIRE_API_KEY: 'true'
      ALLOW_API_KEY_REVEAL: 'false'
      OMNIROUTE_MEMORY_MB: '2048'
      NODE_EXTRA_CA_CERTS: '/run/omniroute-ca/ca-bundle.pem'
      # How long the first, pooled attempt at a cloud provider may wait for its response to start
      # before OmniRoute retries it on a fresh socket. The 30-second default re-queues requests
      # NVIDIA NIM is still holding in its queue: z-ai/glm-5.3-flash started answering after
      # 30-35 seconds, so the abort and retry turned that into 61-65 seconds (measured 2026-10-15).
      # OmniRoute raises it to 180 seconds on its own only for requests that ask for high effort.
      OMNIROUTE_DIRECT_HEADERS_TIMEOUT_MS: '120000'
    ports:
      - '127.0.0.1:20128:20128'
      - '127.0.0.1:20129:20129'
      - '127.0.0.1:20132:20132'
    volumes:
      - type: bind
        source: "${OMNIROUTE_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        target: '/run/omniroute-ca/ca-bundle.pem'
        read_only: true
        bind:
          create_host_path: false
      - 'omniroute-data:/app/data'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.mjs']
      interval: '30s'
      timeout: '5s'
      retries: 3
      start_period: '20s'

volumes:
  omniroute-data:
  omniroute-redis-data:
